[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-local-rppr"
version = "0.4.0"
description = "Deterministic local regularized PageRank with certified dyadic arithmetic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["pruned_rppr*"]

[tool.setuptools.package-data]
pruned_rppr = ["PROVENANCE.json"]
