[project]
name = "hybrid-local-solver"
version = "0.1.0"
description = "Hybrid accelerated local solvers for large-scale graph optimization"
requires-python = "==3.14.*"
dependencies = [
    "numpy>=2.4,<2.5",
    "numba>=0.66",
    "scipy>=1.18",
    "networkx>=3.6.1",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
