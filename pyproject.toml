[project]
name = "hybrid-local-solver"
version = "0.1.0"
description = "Hybrid accelerated local solvers for large-scale graph optimization"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
