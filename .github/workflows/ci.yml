name: Research project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Registry, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          python-version: "3.14"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups

      - name: Check note registry
        run: make note-audit

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Run representative research audits
        run: make research-audit-fast

  reproduction:
    name: Python, synthetic reproduction, figures, and manuscript
    if: github.event_name == 'workflow_dispatch'
    needs: fast-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          python-version: "3.14"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups

      - name: Run synthetic reproduction smoke test
        run: make experiments

      - name: Regenerate offline figures
        run: make figures

      - name: Compile manuscript with regenerated figures
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: main.tex
          working_directory: manuscript
          texlive_version: "2022"
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

  note-matrix:
    name: Read note registry
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      notes: ${{ steps.registry.outputs.notes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read registered note ids
        id: registry
        run: echo "notes=$(python3 manuscript/notes/tools/note_inventory.py ids --format json)" >> "$GITHUB_OUTPUT"

  research-notes:
    name: Research note (${{ matrix.note }})
    if: github.event_name == 'workflow_dispatch'
    needs: note-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        note: ${{ fromJSON(needs.note-matrix.outputs.notes) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile standalone research note
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: main.tex
          working_directory: manuscript/notes/${{ matrix.note }}
          texlive_version: "2022"
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
