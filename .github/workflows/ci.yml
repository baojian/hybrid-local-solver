name: Research project checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Python, synthetic reproduction, and figures
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          python-version: "3.14"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Run synthetic reproduction smoke test
        run: make experiments

      - name: Regenerate offline figures
        run: make figures

  manuscript:
    name: Compile active manuscript
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: main.tex
          working_directory: manuscript
          texlive_version: "2026"
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
